<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>URBAN — Jogo de Combinação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jogo.css">

</head>
<body>

<header class="top">
  <div class="logo">URB<span>AN</span></div>
  <nav class="top-nav" aria-label="Navegação principal">
    <a href="conteudo.html">Conteúdos</a>
    <a href="jogo.html" class="active" aria-current="page">Jogo</a>
    <a href="sobre.html">Sobre nós</a>
    <a href="index.html">Login</a>
  </nav>
</header>

<div class="hero">
  <h1 id="round-heading">Combine os emojis com o termo certo</h1>
  <p class="sub">Cada rodada mostra três combinações de emojis. Ligue cada uma ao termo correspondente no banco de palavras sobre urbanização e sustentabilidade.</p>
  <div class="status-row">
    <span class="pill" id="round-pill">Rodada 1 de 6</span>
    <span class="pill score-pill" id="score-pill">Pontos: 0</span>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
</div>

<main class="stage">
  <section class="game-card" id="game-card" aria-live="polite">
    <!-- filled by JS -->
  </section>
</main>

<div class="feedback-toast" id="toast" role="status" aria-live="assertive"></div>

<div class="skyline" aria-hidden="true">
  <svg viewBox="0 0 1200 160" preserveAspectRatio="none">
    <rect x="0" y="60" width="60" height="100" fill="#1b2030"/>
    <rect x="70" y="30" width="45" height="130" fill="#161b29"/>
    <rect x="125" y="80" width="70" height="80" fill="#1b2030"/>
    <rect x="205" y="50" width="40" height="110" fill="#141824"/>
    <rect x="255" y="90" width="55" height="70" fill="#1b2030"/>
    <rect x="320" y="20" width="35" height="140" fill="#161b29"/>
    <rect x="365" y="70" width="80" height="90" fill="#1b2030"/>
    <rect x="455" y="45" width="50" height="115" fill="#141824"/>
    <rect x="515" y="95" width="60" height="65" fill="#1b2030"/>
    <rect x="585" y="15" width="42" height="145" fill="#161b29"/>
    <rect x="637" y="65" width="75" height="95" fill="#1b2030"/>
    <rect x="722" y="40" width="48" height="120" fill="#141824"/>
    <rect x="780" y="85" width="65" height="75" fill="#1b2030"/>
    <rect x="855" y="25" width="38" height="135" fill="#161b29"/>
    <rect x="903" y="75" width="70" height="85" fill="#1b2030"/>
    <rect x="983" y="50" width="45" height="110" fill="#141824"/>
    <rect x="1038" y="95" width="58" height="65" fill="#1b2030"/>
    <rect x="1106" y="30" width="40" height="130" fill="#161b29"/>
    <rect x="1156" y="70" width="44" height="90" fill="#1b2030"/>
  </svg>
</div>

<script src="jogo.js"></script>

</body>
</html>
