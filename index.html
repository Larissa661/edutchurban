<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urban</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <section class="login">

            <div class="login-conteudo">

                <img class="logo" src="./images/logo.png" alt="Logo Urban">

                <h1>Login</h1>

                <form id="loginForm">

                    <input 
                        type="email" 
                        id="email"
                        placeholder="Email"
                    >

                    <input 
                        type="password" 
                        id="senha"
                        placeholder="Password"
                    >

                    <a class="esqueci" href="#">
                        Esqueci minha senha?
                    </a>

                    <a href="conteudo.html" id="botaoLogin" class="btn-login">Login</a>

                </form>

                <div class="cadastro-link">
                    <span></span>
                    <a href="cadastrar.html">cadastre-se</a>
                    <span></span>
                </div>

            </div>

        </section>

        
        <section class="imagem">
            <img src="./images/cidade_cinza01.jfif" alt="Cidade">
        </section>

    </main>

</body>

</html>
